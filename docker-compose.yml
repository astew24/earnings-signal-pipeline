version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: earnings_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: earnings_signal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: earnings_web
    restart: unless-stopped
    command: python app.py
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/earnings_signal
      POLYGON_API_KEY: ${POLYGON_API_KEY}
      FINBERT_MODEL: ProsusAI/finbert
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
